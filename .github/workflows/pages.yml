name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Veri denetimi
        run: python3 scripts/validate.py
      - name: Seçim sayfaları üretilebiliyor mu
        run: python3 scripts/build_pages.py /tmp/sayfalar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright kur
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Tarayıcı duman testi
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/smoke.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site klasörünü hazırla
        run: |
          mkdir -p _site
          cp -r index.html favicon.svg sw.js manifest.webmanifest icons css js vendor data _site/
          cp google*.html _site/   # Google Search Console doğrulama dosyası
          touch _site/.nojekyll
          # arama motorları için her seçime ayrı sayfa ve site haritası (secim/, sitemap.xml)
          python3 scripts/build_pages.py _site
          # yayımlanan kopyada JS ve CSS sıkıştırılır (kaynak dosyalar değişmez)
          for f in js/app.js js/history.js css/app.css; do npx --yes esbuild@0.24.0 "_site/$f" --minify --allow-overwrite --outfile="_site/$f" --log-level=warning; done
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
